<svg version="1.1" id="EstudioCreativoID_Logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xml:space="preserve">
  <defs>
    <!-- Gradiente High-Tech para la "D" y enlaces -->
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>

    <!-- Gradiente para nodos de la "I" -->
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Filtro de resplandor neón -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Contenedor squircle oscuro de alto contraste para pestañas claras y oscuras -->
  <rect width="512" height="512" rx="115" fill="#0d1117" stroke="rgba(0, 242, 254, 0.3)" stroke-width="8"/>

  <!-- Estructura de la "I": Nodos de circuito y enlaces de bus -->
